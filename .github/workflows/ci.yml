name: Bhoomi CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Test, Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bhoomi
          POSTGRES_PASSWORD: bhoomi
          POSTGRES_DB: bhoomi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        working-directory: backend
        run: |
          pip install flake8
          flake8 app/ --max-line-length=100 --exclude=migrations/

      - name: Type check (mypy)
        working-directory: backend
        run: |
          pip install mypy types-redis
          mypy app/ --ignore-missing-imports --strict-optional || true  # warn only until stubs are complete

      - name: Security — bandit (no raw SQL)
        working-directory: backend
        run: |
          pip install bandit
          bandit -r app/ -ll --skip B101

      - name: Security — pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          FLASK_ENV: testing
          TEST_DATABASE_URL: postgresql://bhoomi:bhoomi@localhost:5432/bhoomi_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret
        run: pytest --cov=app --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
        continue-on-error: true

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Type Check, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint || true  # warn only; failing lint configured Prompt 20

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
        run: npm run build

  # ── Docker build + Trivy scan ─────────────────────────────────────────────
  docker:
    name: Docker Build + Trivy Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bhoomi-backend:ci ./backend

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bhoomi-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
